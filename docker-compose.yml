# Запуск: docker compose up -d --build  →  http://localhost:8081
# Настройки берутся из файла .env рядом (см. .env.example); без него работают значения по умолчанию.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-onyx}:${POSTGRES_PASSWORD:-onyx}@db:5432/${POSTGRES_DB:-onyx}
      SESSION_DAYS: ${SESSION_DAYS:-365}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onyx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onyx}
      POSTGRES_DB: ${POSTGRES_DB:-onyx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
